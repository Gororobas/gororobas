pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,css}"
      run: pnpm run format {staged_files}
      stage_fixed: true
    oxlint:
      glob: "{apps,packages}/*.{ts,tsx,css}"
      run: pnpm run lint --quiet {staged_files}
      stage_fixed: true
    type-check:
      glob: "*.{ts,tsx}"
      run: pnpm run type-check
    test:
      glob: "*.{ts,tsx,feature}"
      run: pnpm run test
