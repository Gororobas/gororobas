name: Check

on:
  push:
    branches: [main, next]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-mutating: formatting, type checks, lint, every collected test, paired BDD coverage
      # and the test-inventory guard.
      - run: pnpm run check
