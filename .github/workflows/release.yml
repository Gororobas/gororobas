name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    name: Select release mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Update release pull request
    needs: [select-mode]
    if: ${{ needs.select-mode.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      # App-authored updates trigger ordinary PR CI, unlike GITHUB_TOKEN pushes.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AUTH_APP_ID }}
          private-key: ${{ secrets.EFFECT_AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          script: ./node_modules/.bin/vp run --no-cache ci:version

  publish:
    name: Publish release
    needs: [select-mode]
    if: ${{ needs.select-mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go
        run: ./node_modules/.bin/vp run patch:tsgo

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AUTH_APP_ID }}
          private-key: ${{ secrets.EFFECT_AUTH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish release
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: ./node_modules/.bin/vp run --no-cache release:checked-publish
