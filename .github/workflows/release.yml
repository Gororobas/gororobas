name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go
        run: ./node_modules/.bin/vp run patch:tsgo

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      # App-authored updates trigger ordinary PR CI, unlike GITHUB_TOKEN pushes.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AUTH_APP_ID }}
          private-key: ${{ secrets.EFFECT_AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: ./node_modules/.bin/vp run --no-cache ci:version
          publish: ./node_modules/.bin/vp run --no-cache release:checked-publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
