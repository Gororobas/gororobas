packages:
  - apps/*
  - packages/*

allowBuilds:
  "@ariga/atlas": true
  "@prisma/engines": false
  esbuild: true
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  node-av: false
  prisma: false
  protobufjs: false

catalog:
  "@durable-streams/client": "^0.2.7"
  "@effect/opentelemetry": "4.0.1"
  "@effect/platform-node": 4.0.1
  "@effect/sql-sqlite-node": "4.0.1"
  "@effect/vitest": 4.0.1
  "@tiptap/core": ^3.31.4
  "@tiptap/html": ^3.31.4
  "@tiptap/pm": ^3.31.4
  "@tiptap/starter-kit": ^3.31.4
  "@types/node": "^26.6.3"
  "@yielded/auth": "0.1.0-beta.18"
  "@yielded/auth-persistence": "0.1.0-beta.18"
  effect: 4.0.1
  effect-units: 0.4.2
  glob: ^13.0.6
  loro-crdt: ^1.16.4
  loro-mirror: ^2.3.3
  loro-prosemirror: 0.4.4
  nanoid: ^6.0.1
  typescript: 7.0.2
  uuid: ^14.0.2
  vitest: ^5.0.3

minimumReleaseAgeExclude:
  - "@yielded/auth-crypto@0.1.0-beta.18"
  - "@yielded/auth-persistence@0.1.0-beta.18"
  - "@yielded/auth@0.1.0-beta.18"

nodeLinker: hoisted

patchedDependencies:
  loro-crdt@1.16.4: patches/loro-crdt@1.16.4.patch
