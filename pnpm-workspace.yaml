packages:
  - apps/*
  - packages/*
  - repos/pleat/packages/*

allowBuilds:
  "@ariga/atlas": false
  "@prisma/engines": false
  esbuild: true
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  node-av: false
  prisma: false
  protobufjs: false

catalog:
  "@effect/ai-openai-compat": ^4.0.5
  "@effect/opentelemetry": "^4.0.5"
  "@effect/platform-node": ^4.0.5
  "@effect/sql-sqlite-node": "^4.0.5"
  "@effect/vitest": ^4.0.5
  "@maple-dev/effect-sdk": "^0.10.0"
  "@tiptap/core": ^3.31.4
  "@tiptap/html": ^3.31.4
  "@tiptap/pm": ^3.31.4
  "@tiptap/starter-kit": ^3.31.4
  "@types/node": ^26.6.5
  "@yielded/auth": "0.1.0-beta.42"
  "@yielded/auth-persistence": "0.1.0-beta.42"
  effect: ^4.0.5
  effect-units: ^1.0.1
  glob: ^13.0.6
  loro-crdt: ^1.16.4
  loro-prosemirror: ^0.4.4
  nanoid: ^6.0.2
  typescript: 7.0.2
  uuid: ^14.0.3
  vitest: ^5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

minimumReleaseAgeExclude:
  - "@foldkit/devtools@0.169.0-canary.f3be22cfeefe"
  - "@foldkit/ui@0.169.0-canary.f3be22cfeefe"
  - foldkit@0.169.0-canary.f3be22cfeefe
  - "@foldkit/oxlint-plugin@0.15.3-canary.f3be22cfeefe"
  - "@foldkit/vite-plugin@0.28.0-canary.f3be22cfeefe"
  - "@yielded/crypto@0.1.0-beta.42"
  - "@yielded/auth-persistence@0.1.0-beta.42"
  - "@yielded/auth@0.1.0-beta.42"
  - "@yielded/jose@0.1.0-beta.42"
  - "@yielded/oauth@0.1.0-beta.42"

nodeLinker: hoisted

overrides:
  # Pleat is a workspace package that pins its own dev versions; one copy of each runtime must serve the whole app.
  effect: "catalog:"
  foldkit: 0.169.0-canary.f3be22cfeefe
  # Hoisted effect-oxlint and its plugins must share the same Schema runtime.
  "@mpsuesser/oxlint-plugin-effect>effect": "catalog:"

patchedDependencies:
  "@yielded/auth-persistence@0.1.0-beta.42": patches/@yielded__auth-persistence@0.1.0-beta.42.patch
  "@yielded/auth@0.1.0-beta.42": patches/@yielded__auth@0.1.0-beta.42.patch
  loro-crdt@1.16.4: patches/loro-crdt@1.16.4.patch
