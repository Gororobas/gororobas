packages:
  - apps/*
  - packages/*
  - repos/pleat/packages/*

allowBuilds:
  "@ariga/atlas": false
  "@prisma/engines": false
  esbuild: true
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  node-av: false
  prisma: false
  protobufjs: false

catalog:
  "@effect/ai-openai-compat": ^4.1.2
  "@effect/opentelemetry": ^4.1.2
  "@effect/platform-browser": ^4.1.2
  "@effect/platform-node": ^4.1.2
  "@effect/sql-sqlite-node": ^4.1.2
  "@effect/vitest": ^4.1.2
  "@lingui/cli": 6.12.0
  "@lingui/core": 6.12.0
  "@lingui/format-po": 6.12.0
  "@lingui/vite-plugin": 6.12.0
  "@maple-dev/effect-sdk": "^0.10.0"
  "@tiptap/core": ^3.31.4
  "@tiptap/html": ^3.31.4
  "@tiptap/pm": ^3.31.4
  "@tiptap/starter-kit": ^3.31.4
  "@types/node": ^26.6.5
  "@yielded/auth": "0.1.0-beta.47"
  "@yielded/auth-persistence": "0.1.0-beta.47"
  effect: ^4.1.2
  effect-units: ^1.0.1
  foldkit: 0.170.0-canary.54f8bcd443b4
  glob: ^13.0.6
  loro-crdt: ^1.16.4
  loro-prosemirror: ^0.4.4
  nanoid: ^6.0.2
  typescript: 7.0.2
  uuid: ^14.0.3
  vitest: ^5.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

minimumReleaseAgeExclude:
  - "@yielded/auth-persistence@0.1.0-beta.47"
  - "@yielded/auth@0.1.0-beta.47"
  - "@yielded/jose@0.1.0-beta.47"
  - "@yielded/oauth@0.1.0-beta.47"
  - "@effect/tsgo-darwin-arm64@0.67.1"
  - "@effect/tsgo-darwin-x64@0.67.1"
  - "@effect/tsgo-linux-arm64@0.67.1"
  - "@effect/tsgo-linux-arm@0.67.1"
  - "@effect/tsgo-linux-x64@0.67.1"
  - "@effect/tsgo-win32-arm64@0.67.1"
  - "@effect/tsgo-win32-x64@0.67.1"
  - "@effect/tsgo@0.67.1"
  - "@tsrs/darwin-arm64@0.21.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.21.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.21.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.21.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.21.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.21.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.21.0-ts7.1.0-beta"
  - tsrs@0.21.0-ts7.1.0-beta

nodeLinker: hoisted

overrides:
  # Pleat is a workspace package that pins its own dev versions; one copy of each runtime must serve the whole app.
  effect: "catalog:"
  "@effect/platform-browser": "catalog:"
  foldkit: "catalog:"
  # Hoisted effect-oxlint and its plugins must share the same Schema runtime.
  "@mpsuesser/oxlint-plugin-effect>effect": "catalog:"

patchedDependencies:
  "@yielded/auth-persistence@0.1.0-beta.47": patches/@yielded__auth-persistence@0.1.0-beta.47.patch
  "@yielded/auth@0.1.0-beta.47": patches/@yielded__auth@0.1.0-beta.47.patch
  loro-crdt@1.16.4: patches/loro-crdt@1.16.4.patch
