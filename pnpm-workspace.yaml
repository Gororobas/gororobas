packages:
  - apps/*
  - packages/*
  - repos/pleat/packages/*

allowBuilds:
  "@ariga/atlas": true
  "@prisma/engines": false
  esbuild: true
  lefthook: true
  lmdb: false
  msgpackr-extract: false
  node-av: false
  prisma: false
  protobufjs: false

catalog:
  "@durable-streams/client": "^0.2.7"
  "@effect/opentelemetry": "4.0.1"
  "@effect/platform-node": 4.0.1
  "@effect/sql-sqlite-node": "4.0.1"
  "@effect/vitest": 4.0.1
  "@maple-dev/effect-sdk": "^0.10.0"
  "@tiptap/core": ^3.31.4
  "@tiptap/html": ^3.31.4
  "@tiptap/pm": ^3.31.4
  "@tiptap/starter-kit": ^3.31.4
  "@types/node": ^26.6.5
  "@yielded/auth": "0.1.0-beta.18"
  "@yielded/auth-persistence": "0.1.0-beta.18"
  effect: 4.0.3
  effect-units: 0.5.0
  glob: ^13.0.6
  loro-crdt: ^1.16.4
  loro-prosemirror: 0.4.4
  nanoid: ^6.0.2
  typescript: 7.0.2
  uuid: ^14.0.3
  vitest: ^5.0.4
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

minimumReleaseAgeExclude:
  - "@yielded/auth-crypto@0.1.0-beta.18"
  - "@yielded/auth-persistence@0.1.0-beta.18"
  - "@yielded/auth@0.1.0-beta.18"

nodeLinker: hoisted

overrides:
  # Hoisted effect-oxlint and its plugins must share the same Schema runtime.
  "@mpsuesser/oxlint-plugin-effect>effect": "catalog:"

patchedDependencies:
  loro-crdt@1.16.4: patches/loro-crdt@1.16.4.patch
